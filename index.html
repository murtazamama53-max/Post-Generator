<style>
  :root {
    --maroon: #7a1620;
    --maroon-dark: #5c0f17;
    --gold: #a9762f;
    --gold-light: #d4b26a;
    --cream: #faf6ee;
    --card: #fffdf7;
    --line: #e6dfcd;
    --ink: #2c2620;
    --muted: #8a7f68;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 100% 0%, #f6ecd8 0%, var(--cream) 45%),
      var(--cream);
    margin: 0;
    padding: 0 0 110px;
    color: var(--ink);
  }
  .topbar {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    padding: 30px 16px 28px;
    text-align: center;
    border-bottom: 1px solid var(--gold);
    box-shadow: 0 1px 0 rgba(212, 178, 106, 0.35), 0 10px 24px -14px rgba(0,0,0,0.5);
    margin-bottom: 26px;
    position: relative;
  }
  .topbar::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -1px;
    transform: translateX(-50%);
    width: 64px;
    height: 2px;
    background: var(--gold-light);
  }
  h1 {
    font-size: 23px;
    font-weight: 600;
    margin: 0;
    color: #fff;
    letter-spacing: 0.4px;
  }
  .topbar .subtitle {
    font-size: 12px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--gold-light);
    font-weight: 500;
    margin-top: 8px;
  }
  .brandmark {
    position: fixed;
    left: 14px;
    bottom: 16px;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.4px;
    opacity: 0.75;
    z-index: 15;
    pointer-events: none;
  }
  .app {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    align-items: flex-start;
    padding: 0 16px;
  }
  .preview-col {
    flex: 1 1 380px;
    max-width: 480px;
    margin: 0 auto;
    position: sticky;
    top: 16px;
  }
  .canvas-wrap {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    touch-action: none;
    box-shadow: 0 12px 30px -14px rgba(122, 22, 32, 0.35), 0 2px 8px rgba(0,0,0,0.05);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }
  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
  }
  .controls {
    flex: 1 1 320px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  fieldset {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px 16px;
    margin: 0;
    background: var(--card);
    box-shadow: 0 4px 14px rgba(122, 22, 32, 0.05);
  }
  legend {
    font-size: 11px;
    font-weight: 600;
    color: var(--gold);
    padding: 0 8px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .icn { display: inline-flex; color: var(--gold); }
  .status-line {
    font-size: 12px;
    min-height: 16px;
    margin-top: 6px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .status-line.show { opacity: 1; transform: translateY(0); }
  .status-line svg { color: #4a8a3c; flex: none; }
  .ghost-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    box-shadow: none;
  }
  .ghost-btn:hover { border-color: var(--gold); color: var(--gold); background: #fffaf0; }
  .canvas-wrap { opacity: 1; transition: opacity 0.25s ease; }
  .canvas-wrap.pulse { animation: pulse-in 0.35s ease; }
  @keyframes pulse-in { 0% { opacity: 0.4; } 100% { opacity: 1; } }
  button#downloadBtn.done { background: linear-gradient(120deg, #2f6e3f 0%, #235430 100%); }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 5px;
    font-weight: 500;
  }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    background: #fffdf9;
    color: var(--ink);
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(169, 118, 47, 0.15);
  }
  input[type="text"][dir="rtl"] { text-align: right; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .row3 > div:nth-child(2) { flex: 0 0 90px; }
  input[type="file"] {
    width: 100%;
    font-size: 13px;
    padding: 6px 0;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--gold);
  }
  .zoom-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .zoom-row span {
    font-size: 12px;
    color: var(--muted);
    min-width: 34px;
    text-align: left;
    font-weight: 500;
  }
  .float-dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 18px;
    display: flex;
    justify-content: center;
    z-index: 20;
    pointer-events: none;
  }
  button#downloadBtn {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    width: auto;
    padding: 14px 30px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.55);
    background: linear-gradient(120deg, rgba(122, 22, 32, 0.82) 0%, rgba(92, 15, 23, 0.86) 100%);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.3px;
    box-shadow: 0 14px 34px -12px rgba(122, 22, 32, 0.55), 0 2px 10px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button#downloadBtn:hover { box-shadow: 0 18px 40px -12px rgba(122, 22, 32, 0.65), inset 0 1px 0 rgba(255,255,255,0.3); transform: translateY(-1px); }
  button#downloadBtn:active { transform: scale(0.97); }
  button#downloadBtn svg { flex: none; }
  .colorpick {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type="color"] {
    width: 36px;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 2px;
    background: #fff;
  }
  .field-pair {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .field-pair > .grow { flex: 1; }
  .field-pair > .swatch-col { flex: none; width: 36px; }
  .drag-hint-row {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .controls { order: 1; }
    .preview-col {
      order: 2;
      position: static;
      max-width: 100%;
      margin-top: 4px;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Sanad Post Generator</h1>
  <div class="subtitle">Saifiyah Boys High School</div>
</div>

<div class="brandmark">Designs By Murtaza™</div>

<div class="app">

  <div class="preview-col">

  <div class="controls">

    <fieldset>

      <label for="nameInput">Full name</label>
      <input type="text" id="nameInput" dir="rtl" value="مفضل بهائي حسين بهائي ڏبه والا">

      <label>Mohalla, age, class</label>

        <div>
          <select id="mohallaInput" dir="rtl"></select>

    </fieldset>

    <fieldset>
      <legend><i class="icn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h11.5v13H6a2 2 0 0 0 0 4h12"/></svg></i> Marhala</legend>

      <select id="marhalaSelect">

        <option value="2">Marhala 2</option>
        <option value="3">Marhala 3</option>
        <option value="4" selected>Marhala 4</option>
        <option value="5">Marhala 5</option>
        <option value="6">Marhala 6</option>
        <option value="7">Marhala 7</option>
        <option value="8">Marhala 8</option>
      </select>

      <label for="marhalaTextInput">Marhala text (auto-filled, editable)</label>
      <input type="text" id="marhalaTextInput" dir="rtl" value="المرحلة الرابعة">

      <div class="row" style="margin-top:8px;">
        <div>
          <label for="marhalaCountInput">Marhala count</label>
          <input type="number" id="marhalaCountInput" value="1" min="0">

function circlePx() {
  return { cx: T.circle.cx * cnv.width, cy: T.circle.cy * cnv.height, r: T.circle.r * cnv.width };
}

function clampCount(v) {
  const n = parseInt(v, 10);
  if (isNaN(n) || n < 0) return '0';
  if (n > 999) return '999';
  return String(n);
}

function draw() {
  if (!bgLoaded) return;
  ctx.clearRect(0, 0, cnv.width, cnv.height);
  ctx.drawImage(bgImg, 0, 0, cnv.width, cnv.height);

  const c = circlePx();

  if (photoImg) {
    const baseScale = Math.max((c.r * 2) / photoImg.naturalWidth, (c.r * 2) / photoImg.naturalHeight);
    const scale = baseScale * zoom;
    const dw = photoImg.naturalWidth * scale;
    const dh = photoImg.naturalHeight * scale;
    const dx = c.cx - dw / 2 + panX;
    const dy = c.cy - dh / 2 + panY;

    ctx.save();
    ctx.beginPath();
    ctx.arc(c.cx, c.cy, c.r * 0.985, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(photoImg, dx, dy, dw, dh);
    ctx.restore();
  }

  const font = document.getElementById('fontSelect').value;
  const nameColor = document.getElementById('nameColor').value;
  const detailColor = document.getElementById('detailColor').value;
  const marhalaColor = document.getElementById('marhalaColor').value;
  const countColor = document.getElementById('countColor').value;
  const nameMult = parseFloat(document.getElementById('nameSizeSlider').value);
  const detailMult = parseFloat(document.getElementById('detailSizeSlider').value);
  const marhalaMult = parseFloat(document.getElementById('marhalaSizeSlider').value);
  const countMult = parseFloat(document.getElementById('countSizeSlider').value);

  ctx.direction = 'rtl';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const bannerH = T.banner.bottom - T.banner.top;
  const bannerCx = ((T.banner.left + T.banner.right) / 2) * cnv.width;
  const pad = 0.12;
  const lineY = i => (T.banner.top + pad * bannerH + (i + 0.5) / 3 * bannerH * (1 - 2 * pad)) * cnv.height;
  const nameSize = Math.round(cnv.height * 0.030 * nameMult);
  const detailSize = Math.round(cnv.height * 0.023 * detailMult);
  const bannerMaxWidth = (T.banner.right - T.banner.left) * cnv.width * 0.94;

  function fitText(text, x, y, weight, baseSize, maxWidth, minSize) {
    let size = baseSize;
    ctx.font = `${weight} ${size}px ${font}`;
    const w = ctx.measureText(text).width;
    if (w > maxWidth) {
      size = Math.max(minSize, Math.floor(baseSize * (maxWidth / w)));
      ctx.font = `${weight} ${size}px ${font}`;
    }
    ctx.fillText(text, x, y);
    return { w: Math.min(w, maxWidth), h: size * 1.3 };
  }

  ctx.fillStyle = nameColor;
  const nameX = bannerCx + nameOffset.x;
  const nameY = lineY(0) + nameOffset.y;
  const nameDims = fitText(document.getElementById('nameInput').value, nameX, nameY, 700, nameSize, bannerMaxWidth, 14);
  nameBBox = { x: nameX - nameDims.w / 2, y: nameY - nameDims.h / 2, w: nameDims.w, h: nameDims.h };

  ctx.fillStyle = detailColor;
  const detailsLine = `${mohallaSelect.value}      عمر: ${document.getElementById('ageInput').value}      ${document.getElementById('classInput').value}`;
  const detailX = bannerCx + detailOffset.x;
  const detailY = lineY(1) + detailOffset.y;
  const detailDims = fitText(detailsLine, detailX, detailY, 400, detailSize, bannerMaxWidth, 12);
  detailBBox = { x: detailX - detailDims.w / 2, y: detailY - detailDims.h / 2, w: detailDims.w, h: detailDims.h };

  fitText(document.getElementById('schoolInput').value, bannerCx, lineY(2), 400, detailSize, bannerMaxWidth, 12);

  const ribbonCx = ((T.ribbon.left + T.ribbon.right) / 2) * cnv.width;
  const ribbonCy = ((T.ribbon.top + T.ribbon.bottom) / 2) * cnv.height;
  const ribbonSize = Math.round(cnv.height * 0.034 * marhalaMult);
  const ribbonMaxWidth = (T.ribbon.right - T.ribbon.left) * cnv.width * 0.82;
  ctx.fillStyle = marhalaColor;
  fitText(document.getElementById('marhalaTextInput').value, ribbonCx, ribbonCy, 700, ribbonSize, ribbonMaxWidth, 14);

  const countSize = Math.round(cnv.height * 0.028 * countMult);
  ctx.font = `700 ${countSize}px ${font}`;
  ctx.direction = 'ltr';
  ctx.fillStyle = countColor;
  const marhalaCountVal = clampCount(document.getElementById('marhalaCountInput').value);
  const totalMarhalaCountVal = clampCount(document.getElementById('totalMarhalaCountInput').value);
  ctx.fillText(marhalaCountVal, T.marhalaCount.x * cnv.width, (T.marhalaCount.y + 0.006) * cnv.height);
  ctx.fillText(totalMarhalaCountVal, T.totalMarhalaCount.x * cnv.width, (T.totalMarhalaCount.y + 0.006) * cnv.height);
}

document.getElementById('photoInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById('photoStatus');
  if (!file.type.startsWith('image/')) {
    status.innerHTML = '';
    status.textContent = 'That file isn\'t an image — pick a JPG or PNG.';
    status.classList.add('show');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => {
    status.innerHTML = '';
    status.textContent = 'Could not read that file. Try another photo.';
    status.classList.add('show');
  };
  reader.onload = ev => {
    const img = new Image();
    img.onerror = () => {
      status.innerHTML = '';
      status.textContent = 'That image could not be loaded. Try another file.';
      status.classList.add('show');
    };
    img.onload = () => {
      photoImg = img;
      zoom = 1;
      panX = 0;
      panY = 0;
      document.getElementById('zoomSlider').value = 1;
      const safeName = file.name.length > 40 ? file.name.slice(0, 37) + '…' : file.name;
      status.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span></span>';
      status.querySelector('span').textContent = ' ' + safeName + ' loaded';
      status.classList.add('show');
      const wrap = document.querySelector('.canvas-wrap');
      wrap.classList.remove('pulse');
      void wrap.offsetWidth;
      wrap.classList.add('pulse');
      draw();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('zoomSlider').addEventListener('input', e => {

});

function getPos(e) {
  const rect = cnv.getBoundingClientRect();
  const scaleX = cnv.width / rect.width;
  const scaleY = cnv.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY, scaleX };
}

function onDown(e) {
  const p = getPos(e);
  const c = circlePx();
  const dist = Math.hypot(p.x - c.cx, p.y - c.cy);
  if (photoImg && dist <= c.r) {
    dragging = true;
    dragTarget = 'photo';
    cnv.classList.add('dragging');
    dragStart = { x: p.x, y: p.y, panX, panY };
    e.preventDefault();
    return;
  }
  if (nameBBox && p.x >= nameBBox.x && p.x <= nameBBox.x + nameBBox.w && p.y >= nameBBox.y && p.y <= nameBBox.y + nameBBox.h) {
    dragging = true;
    dragTarget = 'name';
    cnv.classList.add('dragging');
    dragStart = { x: p.x, y: p.y, offX: nameOffset.x, offY: nameOffset.y };
    e.preventDefault();
    return;
  }
  if (detailBBox && p.x >= detailBBox.x && p.x <= detailBBox.x + detailBBox.w && p.y >= detailBBox.y && p.y <= detailBBox.y + detailBBox.h) {
    dragging = true;
    dragTarget = 'detail';
    cnv.classList.add('dragging');
    dragStart = { x: p.x, y: p.y, offX: detailOffset.x, offY: detailOffset.y };
    e.preventDefault();
  }
}
function onMove(e) {
  if (!dragging) return;
  const p = getPos(e);
  if (dragTarget === 'photo') {
    panX = dragStart.panX + (p.x - dragStart.x);
    panY = dragStart.panY + (p.y - dragStart.y);
  } else if (dragTarget === 'name') {
    nameOffset.x = dragStart.offX + (p.x - dragStart.x);
    nameOffset.y = dragStart.offY + (p.y - dragStart.y);
  } else if (dragTarget === 'detail') {
    detailOffset.x = dragStart.offX + (p.x - dragStart.x);
    detailOffset.y = dragStart.offY + (p.y - dragStart.y);
  }
  draw();
  e.preventDefault();
}
function onUp() {
  dragging = false;
  dragTarget = null;
  cnv.classList.remove('dragging');
}

cnv.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
cnv.addEventListener('touchstart', onDown, { passive: false });
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onUp);
